name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: GTNH 目标版本
        type: choice
        options: [2.9.0-RC-2, 2.9.0]
        required: true
      tag:
        description: 已推送的 annotated tag
        type: string
        required: true
      confirmation:
        description: 输入 PUBLISH <tag>
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
      RELEASE_TAG: ${{ inputs.tag }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 标签触发时 checkout 会把本地标签改为提交引用；先取主分支，再由下步校验并切到发布标签。
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: 核对发布授权与不可变标签
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "PUBLISH $RELEASE_TAG" ]]
          [[ "$RELEASE_TAG" =~ ^gtnh-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?-r[1-9][0-9]*$ ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]
          RELEASE_SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git checkout --detach "$RELEASE_SHA"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 从标签完整校验并构建
        run: python tools/bundle.py build --target "$TARGET" --expect-tag "$RELEASE_TAG"
      - name: 生成发布说明
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == *-RC-* ]]; then
            TARGET_LABEL="GTNH $TARGET 测试版"
          else
            TARGET_LABEL="GTNH $TARGET 正式版"
          fi
          BUNDLE_FILES=(build/dist/*.zip)
          BUNDLE_NAME="${BUNDLE_FILES[0]##*/}"
          BUNDLE_LABEL="下载：${TARGET_LABEL} · Qz 模组包.zip"
          echo "TARGET_LABEL=$TARGET_LABEL" >> "$GITHUB_ENV"
          echo "BUNDLE_NAME=$BUNDLE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_LABEL=$BUNDLE_LABEL" >> "$GITHUB_ENV"
          {
            printf "**适用于%s的 Qz 系列模组包。**\n\n" "$TARGET_LABEL"
            printf "**[下载%s的 Qz 模组包](%s/%s/releases/download/%s/%s)**\n\n" "$TARGET_LABEL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$BUNDLE_NAME"
            printf "Qz 系列模组和需要的文件，都放在这一个包里。包含哪些模组、怎么玩，见[首页说明](https://github.com/%s#readme)。\n\n" "$GITHUB_REPOSITORY"
            printf "以前装过 Qz？先按首页安装说明，把这次要更新的旧 Qz 文件移到备份文件夹，再复制新文件。\n\n"
            printf "1. 关掉游戏，备份游戏文件夹。\n2. 从启动器打开游戏文件夹，找到 mods。找不到？先打开里面的 .minecraft。\n3. 解压下载的包，把包里 mods 中的全部文件复制到游戏的 mods。\n4. 用原来的启动器开游戏。\n\n"
            printf "**包里的文件要全部一起用。**\n\n"
            printf "[看完整安装步骤](https://github.com/%s#readme) · [UILib 怎么搭配](https://github.com/%s#uilib-怎么搭配) · [装不上？点这里反馈](https://github.com/%s/issues/new)\n" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY"
          } > build/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: build/dist/*
          if-no-files-found: error
      - name: 创建正式 Release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" "build/dist/$BUNDLE_NAME#$BUNDLE_LABEL" build/dist/*.json build/dist/*.sha256 --verify-tag --title "$TARGET_LABEL · Qz 模组包" --notes-file build/release-notes.md --latest=false
