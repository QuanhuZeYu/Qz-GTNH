name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: GTNH 目标版本
        type: choice
        options: [2.9.0-RC-2, 2.9.0]
        required: true
      tag:
        description: 已推送的 annotated tag
        type: string
        required: true
      confirmation:
        description: 输入 PUBLISH <tag>
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
      RELEASE_TAG: ${{ inputs.tag }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 标签触发时 checkout 会把本地标签改为提交引用；先取主分支，再由下步校验并切到发布标签。
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: 核对发布授权与不可变标签
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "PUBLISH $RELEASE_TAG" ]]
          [[ "$RELEASE_TAG" =~ ^gtnh-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?-r[1-9][0-9]*$ ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]
          RELEASE_SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git checkout --detach "$RELEASE_SHA"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 从标签完整校验并构建
        run: python tools/bundle.py build --target "$TARGET" --expect-tag "$RELEASE_TAG"
      - name: 生成发布说明和运行证据
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BUNDLE_FILES=(build/dist/*.zip)
          BUNDLE_NAME="${BUNDLE_FILES[0]##*/}"
          {
            printf "# GTNH %s 完整安装包\n\n" "$TARGET"
            printf "**[点击下载完整安装包](%s/%s/releases/download/%s/%s)**\n\n" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$BUNDLE_NAME"
            printf "此 ZIP 已包含 Miner、UILib、Core、字体适配库和 Compat，全部运行 Jar 共同组成一套。\n\n"
            printf "## 安装\n\n1. 关闭游戏，备份对应 GTNH 实例。\n2. 从启动器打开游戏文件夹，移出 mods 中的旧 Qz 运行件，保留原配置。\n3. 用文件管理器解压安装包，将包内 mods 中的全部 Jar 一起复制到游戏已有的 mods 文件夹。\n4. 从启动器照常启动，沿用原 Java 与 UniMixins。联机双方使用同一组合。\n\n"
            printf "附件中的 Source code 是源码；JSON、SHA256 与 evidence 是维护信息。玩家点击上方完整安装包链接即可。\n\n"
            printf "## 组合来源\n\n提供 GTNH %s 的固定 Qz 版本组合，精确版本与来源见随附 JSON 清单。关联问题：QuanhuZeYu/Qz-Miner#259。\n\n" "$TARGET"
            printf "## 验证边界\n\n已完成清单校验、上游 SHA256 核对与打包。游戏启动、联机与渲染待目标实例实机验证。\n\n"
            printf "## 发布证据\n\n- 提交：%s\n- 标签对象：%s\n- 工作流：%s\n\n" "$RELEASE_SHA" "$(git rev-parse "refs/tags/$RELEASE_TAG")" "$RUN_URL"
            cat build/dist/*.sha256
            printf "\n[![](https://img.shields.io/badge/powered_by-dsh-4D6BFE?style=flat-square&logo=deepseek&logoColor=white)](https://github.com/deepseek-ai/deepseek-harness)\n"
          } > build/release-notes.md
          cp build/release-notes.md build/dist/release-evidence.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: build/dist/*
          if-no-files-found: error
      - name: 创建正式 Release
        shell: bash
        run: gh release create "$RELEASE_TAG" build/dist/* --verify-tag --title "Qz-GTNH $RELEASE_TAG" --notes-file build/release-notes.md --latest=false
