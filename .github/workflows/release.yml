name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: GTNH 目标版本
        type: choice
        options: [2.9.0-RC-2, 2.9.0]
        required: true
      tag:
        description: 已推送的 annotated tag
        type: string
        required: true
      confirmation:
        description: 输入 PUBLISH <tag>
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
      RELEASE_TAG: ${{ inputs.tag }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 标签触发时 checkout 会把本地标签改为提交引用；先取主分支，再由下步校验并切到发布标签。
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: 核对发布授权与不可变标签
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "PUBLISH $RELEASE_TAG" ]]
          [[ "$RELEASE_TAG" =~ ^gtnh-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?-r[1-9][0-9]*$ ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]
          RELEASE_SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git checkout --detach "$RELEASE_SHA"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 从标签完整校验并构建
        run: python tools/bundle.py build --target "$TARGET" --expect-tag "$RELEASE_TAG"
      - name: 生成发布说明
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_FILES=(build/dist/*.zip)
          BUNDLE_NAME="${BUNDLE_FILES[0]##*/}"
          {
            printf "适用于 GTNH %s。\n\n" "$TARGET"
            printf "**[下载完整安装包](%s/%s/releases/download/%s/%s)**\n\n" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$BUNDLE_NAME"
            printf "包含 Qz-Miner、Qz-UILib、Core、字体适配库和 Compat，所需文件都在这一个包里。\n\n"
            printf "安装方法：\n\n1. 关闭游戏并备份实例。\n2. 从启动器打开游戏文件夹，移出 mods 中的旧 Qz 模组和运行库，保留配置。\n3. 解压下载的 ZIP，将包内 mods 中的全部 Jar 一起复制到游戏原有的 mods 文件夹。\n4. 在启动器中照常启动游戏。\n\n"
            printf "包内全部 Jar 都要安装。联机时，客户端与服务端使用同一组合。\n"
          } > build/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: build/dist/*
          if-no-files-found: error
      - name: 创建正式 Release
        shell: bash
        run: |
          if [[ "$TARGET" == *-RC-* ]]; then
            RELEASE_TITLE="GTNH $TARGET 测试版 · Qz 完整安装包"
          else
            RELEASE_TITLE="GTNH $TARGET 正式版 · Qz 完整安装包"
          fi
          gh release create "$RELEASE_TAG" build/dist/* --verify-tag --title "$RELEASE_TITLE" --notes-file build/release-notes.md --latest=false
