name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验并构建全部组合
        run: python tools/bundle.py build
      - uses: actions/upload-artifact@v4
        with:
          name: qz-gtnh-combinations
          path: build/dist/*
          if-no-files-found: error
